<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>ADMIN - QUẢN LÝ PHÒNG THI</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --blue: #1e88e5; --red: #ff6b6b; --orange: #ff9800; --dark: #1a1a1a; --white: #fff; --peach: #ffb7b2; }
        body { background: var(--dark); color: var(--white); font-family: sans-serif; padding: 20px; }
        .panel { background: #2d2d2d; padding: 15px; border-radius: 8px; border: 1px solid var(--blue); margin-bottom: 20px; }
        
        input, textarea { 
            padding: 8px; border-radius: 4px; border: 1px solid #444; 
            background: #000; color: #fff; margin-right: 10px; 
            text-transform: uppercase; 
        }

        textarea { width: 100%; box-sizing: border-box; margin-bottom: 10px; text-transform: none; resize: vertical; }
        
        /* Khung chứa bảng có thanh trượt ngang */
        .container { overflow-x: auto; background: #2d2d2d; padding: 15px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        table { width: 100%; border-collapse: collapse; min-width: 2800px; }
        th, td { border: 1px solid #444; padding: 10px; text-align: center; text-transform: uppercase; }
        
        th { background: var(--blue); font-size: 0.8rem; position: sticky; top: 0; z-index: 3; }
        
        /* Cố định các cột bên trái khi cuộn ngang */
        .col-del { width: 50px; position: sticky; left: 0; background: #111; z-index: 2; }
        .col-name { width: 130px; text-align: left; padding-left: 15px; position: sticky; left: 50px; background: #111; z-index: 2; }
        .col-score { width: 80px; color: #00ff00; font-weight: bold; position: sticky; left: 180px; background: #111; z-index: 2; }

        /* Đảm bảo các ô dữ liệu td thuộc các cột cố định có màu nền khi cuộn */
        td.col-del { background: #1a1a1a; }
        td.col-name { background: #1a1a1a; text-align: left; padding-left: 15px; }
        td.col-score { background: #1a1a1a; color: #00ff00; font-weight: bold; }

        .btn { padding: 8px 15px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .btn-add { background: var(--blue); color: white; width: 100%; }
        .btn-reset-ans { background: var(--orange); color: white; width: 100%; }
        .btn-score { background: #00ff00; color: black; width: 100%; margin-top: 10px; }
        .btn-del { background: var(--red); color: white; padding: 5px; font-size: 10px; width: 100%; }

        .admin-correct { background-color: rgba(0, 255, 0, 0.2) !important; color: #00ff00; font-weight: bold; }
        .flex-container { display: flex; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>

    <h2>PLAYTOEIC (ADMIN)</h2>

    <div class="panel">
        <h3>1. Quản lý lớp học (Thêm hàng loạt)</h3>
        <div class="flex-container">
            <textarea id="bulkNames" rows="5" placeholder="Dán danh sách tên tại đây (Mỗi tên một dòng)..."></textarea>
            <button class="btn btn-add" onclick="addBulkPlayers()">THÊM DANH SÁCH HỌC SINH</button>
            <button class="btn btn-reset-ans" onclick="resetAnswersOnly()">XÓA TẤT CẢ ĐÁP ÁN (GIỮ LẠI HỌC SINH)</button>
            <button class="btn" style="background: #555; color: white;" onclick="resetSystem()">XÓA HẾT DỮ LIỆU PHÒNG (BAO GỒM HỌC SINH)</button>
        </div>
    </div>

    <div class="panel">
        <h3>2. Thiết lập Đáp án đúng</h3>
        <div id="ansKeys"></div>
        <button class="btn btn-score" onclick="finalize()">CÔNG BỐ & CHẤM ĐIỂM</button>
    </div>

    <div class="container">
        <table>
            <thead>
                <tr id="headerRow">
                    <th class="col-del">Xóa</th>
                    <th class="col-name">Học sinh</th>
                    <th class="col-score">Điểm</th>
                </tr>
            </thead>
            <tbody id="adminTable"></tbody>
        </table>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAhodfr-XjA3wzeeJTEdFRtn0KFBNJ4mLw",
        authDomain: "nghe-chon-dap-an.firebaseapp.com",
        databaseURL: "https://nghe-chon-dap-an-default-rtdb.firebaseio.com",
        projectId: "nghe-chon-dap-an",
        storageBucket: "nghe-chon-dap-an.firebasestorage.app",
        messagingSenderId: "251465237282",
        appId: "1:251465237282:web:de82395e7513a0774bdb7b",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const numQ = 40;

    // Tạo các ô nhập đáp án đúng từ 1 đến 40
    let keyHtml = '';
    for(let i=0; i<numQ; i++) {
        keyHtml += `Q${i+1}: <input type="text" style="width:30px; margin-bottom:5px" id="key-${i}" oninput="setKey(${i}, this.value)"> `;
    }
    document.getElementById('ansKeys').innerHTML = keyHtml;

    // Tạo tiêu đề các cột câu hỏi (1 -> 40) cho bảng
    function createHeader() {
        const headerRow = document.getElementById('headerRow');
        for(let i=1; i<=numQ; i++) {
            const th = document.createElement('th');
            th.innerText = i;
            headerRow.appendChild(th);
        }
    }

    function setKey(i, val) { 
        db.ref(`class_room/correct_keys/${i}`).set(val.toLowerCase()); 
    }

    // HÀM THÊM HÀNG LOẠT
    function addBulkPlayers() {
        const textArea = document.getElementById('bulkNames');
        const lines = textArea.value.split('\n');
        let count = 0;

        lines.forEach(line => {
            const name = line.trim();
            if (name !== "") {
                db.ref('class_room/players').push({ name: name, score: 0 });
                count++;
            }
        });

        if (count > 0) {
            alert(`Đã thêm thành công ${count} học sinh!`);
            textArea.value = '';
        } else {
            alert("Vui lòng nhập hoặc dán danh sách tên!");
        }
    }

    function deletePlayer(id) { 
        if(confirm("Xóa học sinh này?")) {
            db.ref(`class_room/players/${id}`).remove();
            db.ref(`class_room/answers/${id}`).remove();
        }
    }

function finalize() {
        db.ref('class_room').once('value', snap => {
            const data = snap.val();
            const updates = {};
            for(let id in data.players) {
                let s = 0;
                for(let i=0; i<numQ; i++) {
                    const studentAns = data.answers?.[id]?.[i];
                    const correctKey = data.correct_keys?.[i];
                    if(studentAns && studentAns === correctKey) s += 5; // <-- Đã sửa ở đây
                }
                updates[`class_room/players/${id}/score`] = s;
            }
            updates['class_room/finalized'] = true;
            db.ref().update(updates);
        });
    }

    // HÀM CHỈ XÓA ĐÁP ÁN VÀ RESET ĐIỂM (GIỮ DANH SÁCH HỌC SINH)
    function resetAnswersOnly() {
        if(confirm("Bạn có chắc muốn xóa toàn bộ đáp án và reset điểm về 0 (Danh sách học sinh vẫn được giữ lại)?")) {
            db.ref('class_room').once('value', snap => {
                const data = snap.val() || {};
                const updates = {};
                
                updates['class_room/answers'] = null;
                updates['class_room/correct_keys'] = null;
                updates['class_room/finalized'] = null;

                if(data.players) {
                    for(let id in data.players) {
                        updates[`class_room/players/${id}/score`] = 0;
                    }
                }

                db.ref().update(updates).then(() => {
                    for(let i=0; i<numQ; i++) {
                        const input = document.getElementById(`key-${i}`);
                        if(input) input.value = '';
                    }
                    alert("Đã xóa toàn bộ đáp án và reset điểm thành công!");
                }).catch(error => {
                    console.error("Lỗi khi xóa đáp án: ", error);
                });
            });
        }
    }

    // HÀM XÓA SẠCH PHÒNG THI (XÓA CẢ HỌC SINH)
    function resetSystem() { 
        if(confirm("Xóa hết dữ liệu phòng (bao gồm cả danh sách học sinh và đáp án)?")) {
            db.ref('class_room').remove().then(() => {
                for(let i=0; i<numQ; i++) {
                    const input = document.getElementById(`key-${i}`);
                    if(input) input.value = '';
                }
                alert("Đã xóa sạch dữ liệu phòng!");
            }).catch(error => {
                console.error("Lỗi khi xóa: ", error);
            });
        }
    }

    db.ref('class_room').on('value', snap => {
        const data = snap.val() || {};
        const tbody = document.getElementById('adminTable');
        tbody.innerHTML = '';
        
        for(let i=0; i<numQ; i++) {
            const input = document.getElementById(`key-${i}`);
            if(input) {
                if(data.correct_keys?.[i] && document.activeElement !== input) {
                    input.value = data.correct_keys[i];
                } else if (!data.correct_keys?.[i] && document.activeElement !== input) {
                    input.value = '';
                }
            }
        }

        for(let id in data.players) {
            let row = `<tr>
                <td class="col-del"><button class="btn-del" onclick="deletePlayer('${id}')">X</button></td>
                <td class="col-name">${data.players[id].name}</td>
                <td class="col-score">${data.players[id].score || 0}</td>`;
            
            for(let i=0; i<numQ; i++) {
                const studentAns = data.answers?.[id]?.[i] || '';
                const correctKey = data.correct_keys?.[i] || '';
                const isCorrect = (correctKey !== "" && studentAns === correctKey);
                const cellClass = isCorrect ? 'class="admin-correct"' : '';
                row += `<td ${cellClass}>${studentAns || '-'}</td>`;
            }
            tbody.innerHTML += row + `</tr>`;
        }
    });

    createHeader();
</script>
</body>
</html>
